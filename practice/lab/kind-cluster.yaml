# kind cluster for CKAD practice. practice/scripts/lab-up.sh creates it, lab-down.sh deletes it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ckad
nodes:
  - role: control-plane
    # The Kubernetes minor version the exam runs on. Digest from the kind v0.33.0 release notes,
    # because a bare tag is not guaranteed to match the release.
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # ingress-nginx binds ports 80 and 443 on the node it runs on, and the patch in
    # addons/ingress-nginx pins it to this node, so these are the only ports reachable from the host.
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
