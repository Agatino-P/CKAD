# ingress-nginx, the Ingress controller most CKAD exercises assume (IngressClass "nginx").
# deploy.yaml is the unmodified kind provider manifest of the last release:
#   https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/kind/deploy.yaml
# The project was archived in March 2026, so the manifest is vendored and will not change.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deploy.yaml
patches:
  # Upstream selects only kubernetes.io/os=linux and merely tolerates the control-plane node, so with
  # a worker present the controller can land there. The host port mappings in kind-cluster.yaml lead
  # only to the control-plane node's ports 80 and 443, so the controller must run on that node.
  - target:
      kind: Deployment
      name: ingress-nginx-controller
      namespace: ingress-nginx
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector/ingress-ready
        value: "true"
